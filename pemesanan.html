<script>

function gantiProduk(){

let foto=document.getElementById("fotoProduk");

switch(document.getElementById("produk").selectedIndex){

case 0:

case 1:
foto.src="pepes oncom.png";

function pesan(){

let produk=document.getElementById("produk");
